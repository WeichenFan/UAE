stage_1:
  target: stage1.UAE
  ckpt: 'downloads/checkpoints/Generative_Modeling/Latent_Modeling/64_tokens/ep-last.pt'
  params:
    encoder_cls: 'Dinov2withNorm'
    encoder_config_path: 'facebook/dinov2-with-registers-base'
    encoder_input_size: 224
    encoder_params:
      dinov2_path: 'facebook/dinov2-with-registers-base'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    noise_tau: 0.0
    reshape_to_2d: true
    frequency_config:
      freq_order: zigzag
      freq_transform: dct
      band_split:
        enabled: true
        mode: low
        count: 64
    normalization_stat_path: 'downloads/stats/64_tokens/normalization_stats.pt'

stage_2:
  ckpt: PATH_TO_CKPT
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size: [1152, 2048]
    depth: [28, 2]
    num_heads: [16, 16]
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true

transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    time_dist_type: 'uniform'

sampler:
  mode: ODE
  params:
    sampling_method: rk4
    num_steps: 50
    atol: 1e-6
    rtol: 1e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0
  t-min: 0.0
  t-max: 1.0

misc:
  latent_size: [768, 16, 16] # [C, H, W]
  num_classes: 1000
  time_dist_shift_dim: 196608 # 16*16*768
  time_dist_shift_base: 4096
